<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProteusARC - Gradients of Change Analysis Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <img id="app-logo" src="{{ url_for('static', filename='images/proteusARCatom.png') }}" alt="ProteusARC Logo">
            <h1 class="gradient-title">ProteusARC</h1>
            <div class="dark-mode-toggle">
                <span class="toggle-icon sun-icon">☀</span>
                <input type="checkbox" id="darkModeToggle" class="toggle-checkbox">
                <label for="darkModeToggle" class="toggle-label">
                    <span class="toggle-inner"></span>
                    <span class="toggle-switch"></span>
                </label>
                <span class="toggle-icon moon-icon">☾</span>
            </div>
        </header>
        
        <!-- Rest of the HTML content remains unchanged -->
        
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
